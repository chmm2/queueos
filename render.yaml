# Render blueprint — deploys the whole platform from this repo.
#
# One-time setup (see DEPLOYMENT.md for the click-by-click):
#   1. Create a free MongoDB Atlas cluster and copy its connection string.
#   2. On render.com: New > Blueprint, pick this repo.
#   3. When prompted, paste the Atlas string into MONGO_URI (the only manual
#      value — everything else, including cross-service URLs and the JWT secret,
#      is wired automatically).
#
# Three services: the FastAPI ML model, the Node/Express API + Socket.IO, and
# the React frontend (nginx). All on the free plan (they sleep when idle).
services:
  - type: web
    name: queueos-ml
    runtime: docker
    plan: free
    rootDir: ml-service
    healthCheckPath: /health

  - type: web
    name: queueos-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong secret
      - key: MONGO_URI
        sync: false                  # <-- you paste your Atlas connection string
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: queueos-ml
          property: host             # server-to-server call; Render's private network resolves this fine
      # CLIENT_URL / PUBLIC_WEB_URL are used for CORS checks against the
      # BROWSER's Origin header and for links inside emails/QR codes, so they
      # must be the PUBLIC address, not Render's private "host" property
      # (which only resolves between Render services, never from a browser).
      # Render's free web services are always reachable at
      # https://<service-name>.onrender.com — update this if you rename the
      # service or attach a custom domain.
      - key: CLIENT_URL
        value: https://queueos-web.onrender.com
      - key: PUBLIC_WEB_URL
        value: https://queueos-web.onrender.com

  - type: web
    name: queueos-web
    runtime: docker
    plan: free
    rootDir: frontend
    envVars:
      # Must be the PUBLIC hostname — this gets shipped to the browser as
      # window.__CONFIG__ and fetched directly by the user's browser, which
      # cannot resolve Render's private inter-service "host" value.
      - key: API_HOST
        value: queueos-api.onrender.com
