# Continuous Deployment — ships what CI proved good.
#
# This does NOT run on every push. It waits for the CI workflow to finish on
# main and only proceeds if CI succeeded (`workflow_run` + a conclusion check).
# That ordering is the whole point of CD: never deploy an untested commit.
#
# What it does:
#   1. Builds all three service images and publishes them to GitHub Container
#      Registry (ghcr.io), tagged with both `latest` and the commit SHA so any
#      deploy is traceable and instantly rollback-able.
#   2. Optionally pings a Render deploy hook to roll out the new version.
name: CD

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch: # allows a manual deploy from the Actions tab

concurrency:
  group: cd-main # never let two deploys race each other
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # required to push images to ghcr.io

jobs:
  publish:
    name: Publish images to GHCR
    runs-on: ubuntu-latest
    # Skip entirely if CI failed. (Manual runs bypass this by design.)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    strategy:
      matrix:
        include:
          - service: backend
            context: backend
          - service: ml
            context: ml-service
          - service: web
            context: frontend

    steps:
      # Check out the exact commit CI validated — not whatever is newest.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # provided automatically

      - name: Derive image tags
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA=$(echo "${{ github.event.workflow_run.head_sha || github.sha }}" | cut -c1-7)
          IMAGE="ghcr.io/$OWNER/queueos-${{ matrix.service }}"
          echo "tags=$IMAGE:latest,$IMAGE:$SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Reuse layers between runs so deploys are fast.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Summary
        run: echo "Published ${{ steps.meta.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Trigger hosting deploy
    runs-on: ubuntu-latest
    needs: publish
    steps:
      # Render's blueprint already auto-deploys on push to main. This hook is
      # for when you turn auto-deploy off and want the deploy gated on CI —
      # add RENDER_DEPLOY_HOOK_URL under Settings > Secrets to enable it.
      - name: Call Render deploy hook (if configured)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No RENDER_DEPLOY_HOOK_URL secret set — skipping."
            echo "Images are published; Render's own auto-deploy (if enabled) will pick up this commit."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Render deploy triggered."
